server: https://kubernetes.default.svc
project: default
source:
  repoURL: https://github.com/marvin-steinke/home-server
  targetRevision: main

applicationOverrides:
  argocd:
    finalizers: []
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

namespaces:
  - name: argocd
    apps:
      - argocd
  - name: cert-manager
    wave: -3
    apps:
      - cert-manager
  - name: external-secrets
    wave: -3
    apps:
      - external-secrets
  - name: local-path-provisioner
    wave: -3
    apps:
      - local-path-provisioner
  - name: authentik
    wave: -3
    apps:
      - authentik
  - name: kube-system
    wave: -3
    apps:
      - traefik
  - name: vpn-gateway
    wave: -2
    apps:
      - vpn-gateway
  - name: vpn
    wave: -1
    apps:
      - prowlarr
      - sabnzbd
  - name: cloudflare
    apps:
      - cloudflare-ddns
      - cloudflared
  - name: media
    apps:
      - radarr
      - sonarr
      - bazarr
      - jellyfin
      - seerr
