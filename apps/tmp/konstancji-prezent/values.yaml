app-template:
  controllers:
    konstancji-prezent:
      pod:
        imagePullSecrets:
          - name: konstancji-prezent-ghcr
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      containers:
        app:
          image:
            repository: ghcr.io/marvin-steinke/konstancji-prezent
            digest: sha256:af237b6e3f6d1142fe0af06361e5fdd069e385dd0bcd2b7c90574b53b5a063d6
          command:
            - /bin/sh
            - /etc/konstancji-prezent/start.sh
          envFrom:
            - secretRef:
                name: konstancji-prezent
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: &port 8080
                periodSeconds: 10
            readiness: *probes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
  service:
    app:
      controller: konstancji-prezent
      ports:
        http:
          port: *port
  ingress:
    app:
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - host: &host konstancji-prezent.bobby-dev.de
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: konstancji-prezent-tls
          hosts:
            - *host
  persistence:
    config:
      type: configMap
      name: konstancji-prezent-nginx
      globalMounts:
        - path: /etc/konstancji-prezent
          readOnly: true
    tmp:
      type: emptyDir