apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konstancji-prezent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshPolicy: OnChange
  data:
    - secretKey: SECRET_PATH
      remoteRef:
        key: KONSTANCJI_PREZENT_SECRET_PATH
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konstancji-prezent-ghcr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshPolicy: OnChange
  target:
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ `{{ dict "auths" (dict "ghcr.io" (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc))) | toJson }}` }}'
  data:
    - secretKey: username
      remoteRef:
        key: KONSTANCJI_PREZENT_GHCR_USERNAME
    - secretKey: password
      remoteRef:
        key: KONSTANCJI_PREZENT_GHCR_TOKEN