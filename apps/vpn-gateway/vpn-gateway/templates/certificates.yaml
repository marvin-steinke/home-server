apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: podroute-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: podroute-ca
spec:
  isCA: true
  commonName: podroute-webhook-ca
  secretName: podroute-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: podroute-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: podroute-ca
spec:
  ca:
    secretName: podroute-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: podroute-controller
spec:
  secretName: podroute-controller-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
  dnsNames:
    - podroute-controller.{{ .Release.Namespace }}.svc
    - podroute-controller.{{ .Release.Namespace }}.svc.{{ .Values.global.podroute.network.clusterDomain }}
  issuerRef:
    name: podroute-ca
    kind: Issuer