apiVersion: v1
kind: ConfigMap
metadata:
  name: applications-blueprint
  namespace: {{ .Release.Namespace }}
data:
  applications.yaml: |
    version: 1
    metadata:
      name: applications
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: radarr-provider
        identifiers:
          name: Provider for Radarr
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          access_token_validity: hours=24
          refresh_token_validity: days=30
          mode: forward_single
          external_host: https://radarr.bobby-dev.de
          intercept_header_auth: true
          internal_host_ssl_validation: true
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
      - model: authentik_core.application
        id: radarr-application
        identifiers:
          slug: radarr
        attrs:
          name: Radarr
          provider: !KeyOf radarr-provider
          meta_launch_url: https://radarr.bobby-dev.de
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf radarr-application
          order: 0
        attrs:
          user: !Find [authentik_core.user, [username, akadmin]]
          enabled: true
          timeout: 30
      - model: authentik_providers_proxy.proxyprovider
        id: sonarr-provider
        identifiers:
          name: Provider for Sonarr
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          access_token_validity: hours=24
          refresh_token_validity: days=30
          mode: forward_single
          external_host: https://sonarr.bobby-dev.de
          intercept_header_auth: true
          internal_host_ssl_validation: true
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
      - model: authentik_core.application
        id: sonarr-application
        identifiers:
          slug: sonarr
        attrs:
          name: Sonarr
          provider: !KeyOf sonarr-provider
          meta_launch_url: https://sonarr.bobby-dev.de
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf sonarr-application
          order: 0
        attrs:
          user: !Find [authentik_core.user, [username, akadmin]]
