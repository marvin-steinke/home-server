authentik:

  global:
    envFrom:
      - secretRef:
          name: authentik-external
    volumes:
      - name: authentik-icons
        configMap:
          name: authentik-icons
    volumeMounts:
      - name: authentik-icons
        mountPath: /data/media/public/icons
        readOnly: true
    securityContext:
      runAsUser: 2000
      runAsGroup: 2000
      runAsNonRoot: true
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch

  authentik:
    postgresql:
      host: 192.168.2.117

  blueprints:
    configMaps:
      - authentik-blueprints

  worker:
    envFrom:
      - secretRef:
          name: argocd-oidc
    containerSecurityContext: &containerSecurityContext
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  server:
    containerSecurityContext: *containerSecurityContext
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - &host authentik.bobby-dev.de
      tls:
        - secretName: authentik-tls
          hosts:
            - *host
