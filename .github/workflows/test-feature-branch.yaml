name: Test feature branch
run-name: Test ${{ github.ref_name }} on cluster

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-feature-branch
  cancel-in-progress: false

jobs:
  test-feature-branch:
    name: Validate and deploy selected branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a branch target
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Select a branch, not a tag, when dispatching this workflow."
          exit 1

      - name: Check out selected branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.17.3

      - name: Install jq and yq
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq yq

      - name: Install Argo CD CLI
        env:
          ARGOCD_VERSION: v3.5.1
        run: |
          tool_dir="$RUNNER_TEMP/bin"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64" \
            --output "$tool_dir/argocd"
          chmod 0755 "$tool_dir/argocd"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Validate selected revision before cluster access
        env:
          TARGET_REVISION: ${{ github.ref_name }}
        run: |
          bootstrap_revision="$(yq -r '.source.targetRevision' bootstrap/values.yaml)"
          if [[ "$bootstrap_revision" != "$TARGET_REVISION" ]]; then
            echo "::error::bootstrap/values.yaml must target the selected branch."
            exit 1
          fi
          bash .github/scripts/validate.sh

      - name: Switch root Application to selected revision
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_OPTS: --grpc-web
          ARGOCD_SERVER: argocd.bobby-dev.de
          TARGET_REVISION: ${{ github.ref_name }}
        run: |
          if [[ -z "$ARGOCD_AUTH_TOKEN" ]]; then
            echo "::error::The ARGOCD_AUTH_TOKEN repository secret is not configured."
            exit 1
          fi
          argocd app set home-server --revision "$TARGET_REVISION"
          argocd app wait home-server --sync --health --timeout 900

      - name: Verify deployed revision
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_OPTS: --grpc-web
          ARGOCD_SERVER: argocd.bobby-dev.de
          TARGET_REVISION: ${{ github.ref_name }}
        run: |
          app_json="$(argocd app get home-server --output json)"
          if ! jq -e --arg branch "$TARGET_REVISION" \
            '.spec.source.targetRevision == $branch' <<<"$app_json" >/dev/null; then
            echo "::error::home-server must target the selected branch."
            exit 1
          fi